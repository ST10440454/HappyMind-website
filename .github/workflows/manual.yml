name: CI

# Runs on pull requests and on pushes to every branch EXCEPT main. Pushes to main run these same checks through
# deploy.yml (which calls this file first), so each commit is checked exactly once.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check every PHP file for syntax errors
        run: |
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files are valid."

  js-check:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The site's scripts are ES modules, so check them as modules.
      - name: Syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for f in public/assets/js/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$f::JavaScript syntax error"; exit 1; }
          done
          echo "All scripts are valid."

      # A renamed or deleted file would otherwise only fail in the visitor's browser.
      - name: Every local import exists
        shell: bash
        run: |
          cd public/assets/js
          grep -ohE "from '\./[^']+'" ./*.js | sed -E "s#from '\./##; s#'\$##" | sort -u | while read -r f; do
            [ -f "$f" ] || { echo "::error::Imported file is missing: public/assets/js/$f"; exit 1; }
          done
          echo "All imports resolve."

  smoke-test:
    name: Smoke test (pages, assets, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Start the site and request every page
        shell: bash
        run: |
          # Show and log every PHP problem (warnings and notices too), so nothing is hidden by the server's defaults.
          php -d display_errors=1 -d html_errors=1 -d log_errors=1 -d error_reporting=-1 \
              -S 127.0.0.1:8080 -t public > "$RUNNER_TEMP/php-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8080/index.php && break
            sleep 0.5
          done

          pages="$RUNNER_TEMP/pages"; mkdir -p "$pages"
          failed=0

          # 1. every page renders
          for f in public/*.php; do
            name=$(basename "$f")
            code=$(curl -s -o "$pages/$name.html" -w '%{http_code}' "http://127.0.0.1:8080/$name")
            echo "$name -> $code"
            [ "$code" = 200 ] || { echo "::error::$name returned $code"; failed=1; }
          done

          # 2. every stylesheet, script, image and page link in the rendered HTML exists
          while read -r ref; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$ref")
            [ "$code" = 200 ] || { echo "::error::Broken reference /$ref ($code)"; failed=1; }
          done < <(grep -ohE '(href|src)="(assets/[^"]+|[a-z-]+\.php)[^"]*"' "$pages"/*.html \
                     | sed -E 's/^(href|src)="//; s/"$//; s/[?#].*$//' | sort -u)

          # 3. no PHP warnings, notices or errors, in the page output or in the server log
          if grep -lE '(Warning|Notice|Deprecated|Fatal error|Parse error)</b>:' "$pages"/*.html; then
            echo "::error::PHP warnings or errors are visible in page output"; failed=1
          fi
          if grep -E 'PHP (Warning|Notice|Deprecated|Fatal error|Parse error)' "$RUNNER_TEMP/php-server.log"; then
            echo "::error::PHP reported problems while serving the pages (see above)"; failed=1
          fi

          # 4. every page is complete (a crash half-way through still returns "200")
          for f in "$pages"/*.html; do
            grep -q '</html>' "$f" || { echo "::error::$(basename "$f" .html) is cut short (no closing </html>)"; failed=1; }
          done

          exit "$failed"
